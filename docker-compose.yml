# 生产环境编排：mysql + redis + backend + frontend + nginx（前后端一键部署）
#
# 一键启动（Compose 自动加载根目录 .env，无需任何额外参数）：
#   cp .env.example .env        # 首次：复制模板并填写 REPLACE_* 项
#   docker compose up -d --build
#
# 本地开发只启动 Redis：
#   docker compose up -d redis
#
# 停止 / 重建：
#   docker compose down
#   docker compose up -d --force-recreate
#
# 端口策略：
#   - 仅入口 nginx 暴露到宿主机（HTTP 18080 / HTTPS 18443）
#   - Redis 额外绑定到 127.0.0.1:6379，供宿主机后端本地开发使用
#   - backend/frontend/mysql 仅在 compose 内网可达

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      # 通过 MYSQL_PWD 环境变量传递密码，避免在进程列表/docker inspect 中明文泄露
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - drug-ocr-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - drug-ocr-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内连接名按服务名路由，覆盖 .env 中的 localhost
      DB_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - ./volumes/backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drug-ocr-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - drug-ocr-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/backend-uploads:/var/www/uploads:ro
      # WS2 上线启用 HTTPS 后挂载证书目录
      - ./volumes/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - drug-ocr-net

networks:
  drug-ocr-net:
    driver: bridge
